services:
  miniflux-db:
    image: postgres:16-alpine
    container_name: progressive-reading-miniflux-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MINIFLUX_DB_USER:-miniflux}
      POSTGRES_PASSWORD: ${MINIFLUX_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${MINIFLUX_DB_NAME:-miniflux}
    volumes:
      - miniflux-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MINIFLUX_DB_USER:-miniflux} -d ${MINIFLUX_DB_NAME:-miniflux}"]
      interval: 30s
      timeout: 10s
      retries: 5

  miniflux:
    image: miniflux/miniflux:latest
    container_name: progressive-reading-miniflux
    restart: unless-stopped
    depends_on:
      miniflux-db:
        condition: service_healthy
    ports:
      - "${MINIFLUX_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${MINIFLUX_DB_USER:-miniflux}:${MINIFLUX_DB_PASSWORD:-change-me}@miniflux-db/${MINIFLUX_DB_NAME:-miniflux}?sslmode=disable
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_USERNAME:-admin}
      ADMIN_PASSWORD: ${MINIFLUX_PASSWORD:-change-me}
      POLLING_FREQUENCY: ${MINIFLUX_POLLING_FREQUENCY:-60}
      CLEANUP_ARCHIVE_READ_DAYS: "-1"
      CLEANUP_ARCHIVE_UNREAD_DAYS: "-1"

  rsshub-redis:
    image: redis:7-alpine
    container_name: progressive-reading-rsshub-redis
    restart: unless-stopped
    volumes:
      - rsshub-redis:/data

  rsshub:
    image: diygod/rsshub:latest
    container_name: progressive-reading-rsshub
    restart: unless-stopped
    depends_on:
      - rsshub-redis
    ports:
      - "${RSSHUB_PORT:-1200}:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://rsshub-redis:6379/
      TWITTER_USERNAME: ${TWITTER_USERNAME:-}
      TWITTER_PASSWORD: ${TWITTER_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  miniflux-db:
  rsshub-redis:
